[project]
name = "basketball-ai-tracker"
version = "0.1.0"
description = "AI-assisted basketball video statistics tracker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
cv = [
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.10,<5.0"
]
train = [
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "requests>=2.32,<3.0",
  "ultralytics>=8.3,<9.0"
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
